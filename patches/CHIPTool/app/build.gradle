apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

android {
    namespace 'com.google.chip.chiptool'
    compileSdkVersion 34
    ndkPath System.getenv("ANDROID_NDK_HOME")

    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.google.chip.chiptool"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        if (matterSdkSourceBuild.toBoolean() && !matterBuildSrcDir.isEmpty()) {
            ndk {
                abiFilters = []
                abiFilters.addAll(matterSourceBuildAbiFilters.split(';').collect { it as String })
            }
        }

        externalNativeBuild {
            cmake {
                targets "default"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        allWarningsAsErrors = false
    }


    buildFeatures {
        viewBinding = true
    }

    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            def requested = details.requested
            if (requested.group == "androidx") {
                if (!requested.name.startsWith("multidex")) {
                    details.useVersion "${targetSdk}.+"
                }
            }
        }
    }

    if (matterSdkSourceBuild.toBoolean() && !matterBuildSrcDir.isEmpty()) {
        externalNativeBuild {
            cmake {
                path file(matterBuildSrcDir + '/CMakeLists.txt')
                version '3.10.2'
            }
        }
    } else {
        sourceSets {
            main {
                jniLibs.srcDirs = ['libs/jniLibs']
            }
        }
    }
}

dependencies {
    implementation 'com.android.volley:volley:1.2.1'
    def room_version = "2.2.5"

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    if (matterSdkSourceBuild.toBoolean() && !matterBuildSrcDir.isEmpty()) {
        implementation project(':chip-library')
    } else {
        implementation fileTree(dir: "libs", include: ["*.jar", "*.so"])
    }

    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.fragment:fragment:1.3.0-beta01'
    implementation "androidx.annotation:annotation:1.1.0"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    implementation "androidx.core:core-ktx:1.3.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.work:work-runtime:2.7.1"
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.jjoe64:graphview:4.2.2'

    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    implementation 'com.google.protobuf:protobuf-java:3.22.0'

    // WebSocket-Client (socket.io v2) fuer die direkte ioBroker-Anbindung ueber den web-Adapter.
    // org.json wird ausgeschlossen, weil Android org.json bereits mitbringt (sonst Duplicate-Class-Fehler).
    implementation('io.socket:socket.io-client:1.0.1') {
        exclude group: 'org.json', module: 'json'
    }
}

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------------------
// Generiert MatterNames.kt (Cluster-/Attribut-Namen) aus den offiziellen
// ZCL-XML-Dateien des SDKs. Laeuft automatisch vor dem Kotlin-Compile.
// Defensiv: bei Problemen wird eine gueltige (ggf. leere) Datei geschrieben,
// damit der Build nie bricht (die App faellt dann auf Roh-Werte zurueck).
// ---------------------------------------------------------------------------
def matterNamesOutDir = "$buildDir/generated/matternames"

tasks.register('generateMatterNames') {
    def outDir = file(matterNamesOutDir)
    outputs.dir outDir
    doLast {
        def clusterNames = [:]   // Long -> String
        def attrNames = [:]      // Long -> (Long -> String)
        def enumsByName = [:]    // String -> (Long -> String)
        def attrTypes = [:]      // "cCode/aCode" -> Enum-Typname
        try {
            def candidates = [
                file("$projectDir/../../../../src/app/zap-templates/zcl/data-model/chip"),
                file("$rootDir/../../../src/app/zap-templates/zcl/data-model/chip"),
            ]
            def xmlDir = candidates.find { it.isDirectory() }
            if (xmlDir == null) {
                logger.warn("MatterNames: ZCL-XML-Verzeichnis nicht gefunden -> leere Tabelle (App zeigt Roh-Werte).")
            } else {
                xmlDir.listFiles({ f -> f.name.endsWith('.xml') } as FileFilter).each { xf ->
                    try {
                        def cfg = new groovy.xml.XmlSlurper().parse(xf)
                        cfg.'enum'.each { en ->
                            def enName = (en.@name.text() ?: '').trim()
                            if (enName) {
                                def items = [:]
                                en.item.each { it2 ->
                                    def vTxt = (it2.@value.text() ?: '').trim()
                                    def iName = (it2.@name.text() ?: '').trim()
                                    if (vTxt && iName) { try { items[Long.decode(vTxt)] = iName } catch (Exception ignore) {} }
                                }
                                if (items) enumsByName[enName] = items
                            }
                        }
                        cfg.cluster.each { cl ->
                            def codeTxt = cl.code.text()?.trim()
                            if (codeTxt) {
                                def cCode = Long.decode(codeTxt)
                                def cName = cl.name.text()?.trim()
                                if (cName) clusterNames[cCode] = cName
                                def am = attrNames.get(cCode, [:])
                                cl.attribute.each { at ->
                                    def aCodeTxt = (at.@code.text() ?: '').trim()
                                    def aName = (at.@name.text() ?: '').trim()
                                    if (!aName) aName = (at.text() ?: '').trim()
                                    def aType = (at.@type.text() ?: '').trim()
                                    if (aCodeTxt) {
                                        def aCode = Long.decode(aCodeTxt)
                                        if (aName) am[aCode] = aName
                                        if (aType) attrTypes["${cCode}/${aCode}"] = aType
                                    }
                                }
                            }
                        }
                    } catch (Exception e) {
                        logger.warn("MatterNames: ${xf.name} nicht geparst: ${e.message}")
                    }
                }
            }
        } catch (Exception e) {
            logger.warn("MatterNames: Fehler beim Scannen: ${e.message}")
        }

        // Attribute mit Enum-Typ aufloesen -> cCode -> (aCode -> {Wert -> Name})
        def attrEnums = [:]
        try {
            attrTypes.each { k, typeName ->
                def items = enumsByName[typeName]
                if (items) {
                    def p = k.split('/')
                    attrEnums.get(p[0] as Long, [:]).put(p[1] as Long, items)
                }
            }
        } catch (Exception e) {
            logger.warn("MatterNames: Enum-Aufloesung fehlgeschlagen: ${e.message}")
        }

        def pkgDir = new File(outDir, "com/google/chip/chiptool")
        pkgDir.mkdirs()
        def esc = { String s -> s.replace('\\', '\\\\').replace('"', '\\"').replace('$', '\\$') }
        def sb = new StringBuilder()
        sb << "package com.google.chip.chiptool\n\n"
        sb << "// AUTO-GENERATED by the generateMatterNames Gradle task. Do not edit.\n"
        sb << "object MatterNames {\n"
        sb << "    val clusterNames: Map<Long, String> = mapOf(\n"
        clusterNames.sort().each { k, v -> sb << "        ${k}L to \"${esc(v)}\",\n" }
        sb << "    )\n"
        sb << "    val attributeNames: Map<Long, Map<Long, String>> = mapOf(\n"
        attrNames.sort().each { c, m ->
            sb << "        ${c}L to mapOf(\n"
            m.sort().each { a, n -> sb << "            ${a}L to \"${esc(n)}\",\n" }
            sb << "        ),\n"
        }
        sb << "    )\n"
        sb << "    // cluster -> attribut -> (enumWert -> Klartext)\n"
        sb << "    val attributeEnums: Map<Long, Map<Long, Map<Long, String>>> = mapOf(\n"
        attrEnums.sort().each { c, am ->
            sb << "        ${c}L to mapOf(\n"
            am.sort().each { a, vm ->
                sb << "            ${a}L to mapOf(\n"
                vm.sort().each { v, n -> sb << "                ${v}L to \"${esc(n)}\",\n" }
                sb << "            ),\n"
            }
            sb << "        ),\n"
        }
        sb << "    )\n"
        sb << "    fun cluster(id: Long): String = clusterNames[id] ?: (\"Cluster 0x%04X\".format(id))\n"
        sb << "    fun attribute(clusterId: Long, attrId: Long): String =\n"
        sb << "        attributeNames[clusterId]?.get(attrId) ?: (\"Attr 0x%04X\".format(attrId))\n"
        sb << "    fun attributeEnum(clusterId: Long, attrId: Long, value: Long): String? =\n"
        sb << "        attributeEnums[clusterId]?.get(attrId)?.get(value)\n"
        sb << "}\n"
        new File(pkgDir, "MatterNames.kt").text = sb.toString()
        logger.lifecycle("MatterNames: ${clusterNames.size()} Cluster, ${attrEnums.size()} Cluster mit Enums generiert nach ${outDir}")
    }
}

android.sourceSets.main.java.srcDirs += matterNamesOutDir

afterEvaluate {
    tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Kotlin') }.configureEach {
        dependsOn 'generateMatterNames'
    }
    tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'generateMatterNames' }
}
